<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>ClipForge</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--tg-theme-bg-color, #0e0e0e);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 20px;
        }

        .logo {
            font-size: 30px;
            font-weight: 800;
        }

        .subtitle {
            margin-top: 5px;
            margin-bottom: 22px;
            color: var(--tg-theme-hint-color, #8e8e93);
        }

        .card {
            background: var(--tg-theme-secondary-bg-color, #1c1c1e);
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 14px;
        }

        .title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        button {
            border: 0;
            border-radius: 12px;
            padding: 13px 8px;
            background: var(--tg-theme-bg-color, #2a2a2a);
            color: var(--tg-theme-text-color, #ffffff);
            font-size: 14px;
            font-weight: 600;
        }

        button.active {
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
        }

        .upload,
        .continue {
            width: 100%;
            padding: 17px;
            font-size: 17px;
        }

        .upload {
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
        }

        .continue {
            display: none;
            margin-top: 12px;
            background: #31b55c;
            color: white;
        }

        .file-info {
            display: none;
            margin-top: 14px;
            padding: 14px;
            border-radius: 14px;
            background: var(--tg-theme-bg-color, #101010);
        }

        .file-name {
            font-weight: 700;
            word-break: break-word;
        }

        .file-size {
            margin-top: 5px;
            color: var(--tg-theme-hint-color, #8e8e93);
            font-size: 13px;
        }

        .status {
            display: none;
            margin-top: 14px;
            padding: 14px;
            border-radius: 14px;
            background: var(--tg-theme-secondary-bg-color, #1c1c1e);
        }

        .small {
            margin-top: 8px;
            color: var(--tg-theme-hint-color, #8e8e93);
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">🎬 ClipForge</div>

    <div class="subtitle">
        Монтаж коротких видео
    </div>


    <!-- КАЧЕСТВО -->

    <div class="card">

        <div class="title">📺 Качество</div>

        <div class="buttons">

            <button onclick="setQuality(144)" id="q144">
                144p
            </button>

            <button onclick="setQuality(360)" id="q360">
                360p
            </button>

            <button onclick="setQuality(480)" id="q480">
                480p
            </button>

            <button onclick="setQuality(720)" id="q720">
                720p
            </button>

            <button onclick="setQuality(1080)" id="q1080">
                1080p
            </button>

        </div>

    </div>


    <!-- ФОРМАТ -->

    <div class="card">

        <div class="title">📱 Формат</div>

        <div class="buttons">

            <button
                id="formatVertical"
                onclick="setFormat('vertical')"
            >
                9:16
            </button>

            <button
                id="formatOriginal"
                onclick="setFormat('original')"
            >
                Оригинал
            </button>

        </div>

    </div>


    <!-- СУБТИТРЫ -->

    <div class="card">

        <div class="title">💬 Субтитры</div>

        <div class="buttons">

            <button
                id="subOff"
                onclick="setSubtitles('off')"
            >
                Выкл
            </button>

            <button
                id="subNormal"
                onclick="setSubtitles('normal')"
            >
                Обычные
            </button>

            <button
                id="subBold"
                onclick="setSubtitles('bold')"
            >
                Жирные
            </button>

        </div>

    </div>


    <!-- AI -->

    <div class="card">

        <div class="title">🤖 AI улучшение</div>

        <div class="buttons">

            <button
                id="aiOff"
                onclick="setAI(false)"
            >
                Выкл
            </button>

            <button
                id="aiOn"
                onclick="setAI(true)"
            >
                Вкл
            </button>

        </div>

        <div class="small">
            AI-улучшение подключим отдельно.
        </div>

    </div>


    <!-- ВИДЕО -->

    <div class="card">

        <div class="title">🎬 Видео</div>

        <button
            class="upload"
            onclick="chooseVideo()"
        >
            📤 Выбрать видео
        </button>

        <input
            id="video"
            type="file"
            accept="video/*"
            style="display:none"
            onchange="videoSelected()"
        >


        <div
            id="fileInfo"
            class="file-info"
        >

            <div
                id="fileName"
                class="file-name"
            ></div>

            <div
                id="fileSize"
                class="file-size"
            ></div>

        </div>


        <button
            id="continueButton"
            class="continue"
            onclick="continueProcessing()"
        >
            🚀 Продолжить
        </button>

    </div>


    <div
        id="status"
        class="status"
    ></div>

</div>


<script>

    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();


    let settings = {
        quality: 720,
        format: "vertical",
        subtitles: "off",
        ai: false
    };


    let selectedFile = null;


    // =========================
    // ОБНОВЛЕНИЕ ПАНЕЛИ
    // =========================

    function updateUI() {

        document
            .querySelectorAll("button")
            .forEach(button => {
                button.classList.remove("active");
            });


        const qualityButton =
            document.getElementById(
                "q" + settings.quality
            );

        if (qualityButton) {
            qualityButton.classList.add("active");
        }


        if (settings.format === "vertical") {

            document
                .getElementById("formatVertical")
                .classList.add("active");

        } else {

            document
                .getElementById("formatOriginal")
                .classList.add("active");
        }


        if (settings.subtitles === "off") {

            document
                .getElementById("subOff")
                .classList.add("active");

        }

        if (settings.subtitles === "normal") {

            document
                .getElementById("subNormal")
                .classList.add("active");

        }

        if (settings.subtitles === "bold") {

            document
                .getElementById("subBold")
                .classList.add("active");

        }


        if (settings.ai) {

            document
                .getElementById("aiOn")
                .classList.add("active");

        } else {

            document
                .getElementById("aiOff")
                .classList.add("active");
        }
    }


    // =========================
    // НАСТРОЙКИ
    // =========================

    function setQuality(value) {

        settings.quality = value;

        updateUI();
    }


    function setFormat(value) {

        settings.format = value;

        updateUI();
    }


    function setSubtitles(value) {

        settings.subtitles = value;

        updateUI();
    }


    function setAI(value) {

        settings.ai = value;

        updateUI();
    }


    // =========================
    // ВЫБОР ВИДЕО
    // =========================

    function chooseVideo() {

        document
            .getElementById("video")
            .click();
    }


    // =========================
    // РАЗМЕР ФАЙЛА
    // =========================

    function formatBytes(bytes) {

        if (bytes < 1024 * 1024) {

            return (
                (bytes / 1024).toFixed(1)
                + " KB"
            );
        }

        return (
            (bytes / (1024 * 1024)).toFixed(1)
            + " MB"
        );
    }


    // =========================
    // ВИДЕО ВЫБРАНО
    // =========================

    function videoSelected() {

        const input =
            document.getElementById("video");

        selectedFile = input.files[0];


        if (!selectedFile) {
            return;
        }


        document
            .getElementById("fileName")
            .textContent =
            "🎬 " + selectedFile.name;


        document
            .getElementById("fileSize")
            .textContent =
            "📦 " + formatBytes(selectedFile.size);


        document
            .getElementById("fileInfo")
            .style.display = "block";


        document
            .getElementById("continueButton")
            .style.display = "block";


        const status =
            document.getElementById("status");

        status.style.display = "block";

        status.innerHTML =
            "✅ Видео выбрано<br><br>" +

            "📺 Качество: " +
            settings.quality +
            "p<br>" +

            "📱 Формат: " +
            (
                settings.format === "vertical"
                    ? "9:16"
                    : "Оригинал"
            ) +
            "<br>" +

            "💬 Субтитры: " +
            settings.subtitles +
            "<br>" +

            "🤖 AI: " +
            (
                settings.ai
                    ? "Вкл"
                    : "Выкл"
            );
    }


    // =========================
    // ПРОДОЛЖИТЬ / ЗАГРУЗКА
    // =========================

    async function continueProcessing() {

        if (!selectedFile) {

            tg.showAlert(
                "Сначала выбери видео."
            );

            return;
        }


        const status =
            document.getElementById("status");


        const continueButton =
            document.getElementById(
                "continueButton"
            );


        continueButton.disabled = true;

        continueButton.textContent =
            "⏳ Загружаю...";


        status.style.display = "block";

        status.innerHTML =
            "📤 Загружаю видео на ClipForge...";


        const formData = new FormData();


        formData.append(
            "video",
            selectedFile
        );


        // ID пользователя Telegram

        const userId =
            tg.initDataUnsafe &&
            tg.initDataUnsafe.user
                ? tg.initDataUnsafe.user.id
                : "";


        formData.append(
            "chat_id",
            userId
        );


        formData.append(
            "quality",
            settings.quality
        );


        formData.append(
            "format",
            settings.format
        );


        formData.append(
            "subtitles",
            settings.subtitles
        );


        formData.append(
            "ai",
            settings.ai
        );


        try {

            const response =
                await fetch(
                    "/api/upload",
                    {
                        method: "POST",
                        body: formData
                    }
                );


            const result =
                await response.json();


            if (!result.ok) {

                throw new Error(
                    result.error ||
                    "Ошибка загрузки"
                );
            }


            status.innerHTML =
                "⚙️ <b>Видео отправлено!</b><br><br>" +

                "Сейчас ClipForge его обработает." +
                "<br><br>" +

                "📺 " +
                settings.quality +
                "p<br>" +

                "📱 " +
                (
                    settings.format === "vertical"
                        ? "9:16"
                        : "Оригинал"
                ) +
                "<br>" +

                "💬 " +
                settings.subtitles +
                "<br>" +

                "🤖 AI: " +
                (
                    settings.ai
                        ? "Вкл"
                        : "Выкл"
                );


            continueButton.textContent =
                "✅ Отправлено";


            tg.showAlert(
                "Видео отправлено на обработку!"
            );


        } catch (error) {

            console.error(error);


            status.innerHTML =
                "❌ Ошибка загрузки:<br><br>" +
                error.message;


            continueButton.disabled = false;

            continueButton.textContent =
                "🚀 Продолжить";
        }
    }


    // =========================
    // ЗАПУСК
    // =========================

    updateUI();

</script>

</body>
</html>
